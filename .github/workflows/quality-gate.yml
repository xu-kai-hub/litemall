name: quality-gate

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install modules
        run: mvn -B -Dmaven.test.skip=true install

      - name: Unit tests and JaCoCo
        run: mvn -B -pl litemall-db test -Dtest=CouponVerifyServiceTest -DfailIfNoTests=false

      - name: Coverage gate
        run: python3 ci/quality_gate.py --jacoco litemall-db/target/site/jacoco/jacoco.xml --min-branch 0.85

      - name: Mutation testing
        run: mvn -B -pl litemall-db org.pitest:pitest-maven:mutationCoverage

      - name: Mutation gate
        run: python3 ci/quality_gate.py --pit litemall-db/target/pit-reports/mutations.xml --min-mutation 0.85

      - name: SonarQube scan
        if: ${{ env.SONAR_TOKEN != '' }}
        run: >
          mvn -B -pl litemall-db sonar:sonar
          -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }}
          -Dsonar.login=$SONAR_TOKEN
          -Dsonar.qualitygate.wait=true
